name: Build Ethio Edu AI Windows Installer

on:
  push:
    branches: [ "main" ]

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        # cache: 'npm' እዚህ ጋር የነበረውን አጥፍተነዋል

    - name: Install Dependencies
      run: npm install

    - name: Download llama-server.exe (ለዊንዶውስ)
      run: |
        New-Item -ItemType Directory -Force -Path bin
        Invoke-WebRequest -Uri "https://github.com/ggerganov/llama.cpp/releases/download/b4000/llama-b4000-bin-win-vulkan-x64.zip" -OutFile "llama.zip"
        Expand-Archive -Path "llama.zip" -DestinationPath "llama_temp"
        
        # ፋይሉ የሚገኝበትን ትክክለኛ ቦታ ፈልጎ መቅዳት
        $exeFile = Get-ChildItem -Path "llama_temp" -Recurse -Filter "llama-server.exe"
        Copy-Item $exeFile.FullName -Destination "bin/llama-server.exe"
        
        Remove-Item "llama.zip", "llama_temp" -Recurse
